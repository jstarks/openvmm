[package]
name = "virt_emu"
edition.workspace = true
rust-version.workspace = true

[features]
perf = ["strudel/perf", "dep:sparse_mmap"]
test-support = ["guestmem/bitmap"]

[[test]]
name = "native_backend"
required-features = ["test-support"]

[[example]]
name = "fast_path"
required-features = ["perf"]

[dependencies]
guestmem.workspace = true
memory_range.workspace = true
virt.workspace = true
x86_system.workspace = true
strudel.workspace = true
thiserror.workspace = true
anyhow.workspace = true
futures.workspace = true
hvdef.workspace = true
inspect.workspace = true
vmcore.workspace = true
vm_topology.workspace = true
trycopy.workspace = true
parking_lot.workspace = true
sparse_mmap = { workspace = true, optional = true }

[dev-dependencies]
strudel = { workspace = true, features = ["test-support"] }
x86_decode.workspace = true
x86_system = { workspace = true, features = ["reference"] }
loader.workspace = true
vm_loader.workspace = true
vmm_core.workspace = true
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
test_with_tracing.workspace = true
pal_async.workspace = true
state_unit.workspace = true
vm_resource.workspace = true
vmotherboard.workspace = true
serial_16550.workspace = true
serial_16550_resources.workspace = true
serial_core.workspace = true
chipset.workspace = true
chipset_device.workspace = true
chipset_device_resources.workspace = true
chipset_resources.workspace = true
missing_dev.workspace = true
local_clock = { workspace = true, features = ["inspect"] }
sparse_mmap.workspace = true

[build-dependencies]
build_rs_guest_arch.workspace = true

[lints]
workspace = true
